<style>
/* Layout: app de taller — encabezado fijo, contenido de una columna (máx 920px), barra inferior de pestañas. Aluminio anodizado + verde de canto de vidrio. */
:root{
  --bg:#f3f1ee;          /* fondo cálido claro */
  --surface:#ffffff;
  --surface-2:#ebe6e0;
  --line:#d8d0c7;
  --fg:#1f1a17;
  --muted:#6a5f58;
  --accent:#9a6430;      /* cobre de la marca */
  --accent-ink:#ffffff;
  --accent-soft:#f3e6d8;
  --metal:#17130f;       /* negro de la marca */
  --metal-ink:#efe7df;
  --glass:#dbe9ef;
  --ok:#237a3b; --ok-soft:#dcefe0;
  --warn:#9a6200; --warn-soft:#f6ead2;
  --bad:#b23a2e; --bad-soft:#f7dedb;
  --info:#2f5f9e; --info-soft:#dde7f5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-brand:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12100e;--surface:#1b1815;--surface-2:#25211d;--line:#3a332c;--fg:#efe9e3;--muted:#a89c91;
  --accent:#d4a373;--accent-ink:#1a120a;--accent-soft:#3a2a1c;--metal:#0b0908;--metal-ink:#efe7df;--glass:#1d2a30;
  --ok:#6cc483;--ok-soft:#18321f;--warn:#e0aa4a;--warn-soft:#352812;--bad:#ec7b6f;--bad-soft:#3a1c19;--info:#7fa9e6;--info-soft:#1a2a40;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12100e;--surface:#1b1815;--surface-2:#25211d;--line:#3a332c;--fg:#efe9e3;--muted:#a89c91;
  --accent:#d4a373;--accent-ink:#1a120a;--accent-soft:#3a2a1c;--metal:#0b0908;--metal-ink:#efe7df;--glass:#1d2a30;
  --ok:#6cc483;--ok-soft:#18321f;--warn:#e0aa4a;--warn-soft:#352812;--bad:#ec7b6f;--bad-soft:#3a1c19;--info:#7fa9e6;--info-soft:#1a2a40;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--metal)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--metal);color:var(--metal-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.brand-mark{height:38px;width:auto;flex:none}
.brand-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand b{font:600 22px/1 var(--f-brand);letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(180deg,#f3e3d0 0,#d4a373 55%,#b07a45 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font:500 10px/1 var(--f-mono);color:#a89c91;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-bar{height:5px;max-width:920px;margin:8px auto 0;border-radius:2px;
  background:linear-gradient(90deg,#8e8e8e 0,#e6e6e6 30%,#c9c9c9 48%,#d4a373 52%,#f0cfa8 72%,#a8713e 100%)}
.icon-btn{background:transparent;border:1px solid #4a4038;color:var(--metal-ink);border-radius:8px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.icon-btn:hover{border-color:#a8713e}
.sync{font:500 11px/1 var(--f-mono);color:#a89c91;white-space:nowrap}
.sync.err{color:#f0a097}

/* Main */
main{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:17px;font-weight:600}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
button.stat{text-align:left;cursor:pointer;font:inherit;color:inherit}
button.stat:hover{border-color:var(--muted)}
button.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat .v{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:6px;word-break:break-word}
@media (max-width:420px){.stat .v{font-size:19px}}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dark{background:var(--metal);color:var(--metal-ink);border-color:var(--metal)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}

/* Chips & pills */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--metal);color:var(--metal-ink);border-color:var(--metal)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-cot{background:var(--info-soft);color:var(--info)}
.st-apr{background:var(--accent-soft);color:var(--accent)}
.st-pro{background:var(--warn-soft);color:var(--warn)}
.st-ins{background:var(--warn-soft);color:var(--warn)}
.st-ent{background:var(--ok-soft);color:var(--ok)}
.st-pag{background:var(--ok-soft);color:var(--ok)}
.st-par{background:var(--warn-soft);color:var(--warn)}
.st-pen{background:var(--bad-soft);color:var(--bad)}
.st-anu{background:var(--surface-2);color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600}
.li .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.04em}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 10px;background:var(--surface-2);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface-2)}

/* Forms */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px;min-height:44px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer;flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.note{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--fg);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.info{border-color:var(--info);background:var(--info-soft)}
.total-bar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--metal);color:var(--metal-ink);border-radius:var(--r);padding:14px 16px}
.total-bar .v{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* Window sketch */
.sketch{display:flex;justify-content:center;background:var(--surface-2);border-radius:8px;padding:10px}
.sketch svg{max-width:100%;height:auto}

/* Bars (despiece) */
.bar{display:flex;height:26px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.bar .cut{background:var(--metal);color:var(--metal-ink);font:500 10px/26px var(--f-mono);text-align:center;overflow:hidden;white-space:nowrap;border-right:2px solid var(--bg);min-width:0}
.bar .cut.alt{background:color-mix(in srgb,var(--metal) 62%,var(--accent))}
.barline{display:grid;grid-template-columns:56px minmax(0,1fr) 66px;gap:8px;align-items:center;font-size:12px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--bg);padding-block:4px;z-index:2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--metal);color:var(--metal-ink);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}
.sheet>*{flex-shrink:0}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.cols2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.cin{border:1px solid var(--line);border-radius:6px;padding:7px;background:var(--surface);font-size:16px;min-height:38px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}a.btn:not(.pri):not(.dark){color:inherit}
.pf-foto{display:flex;flex-direction:column;align-items:center;gap:1px}.pf-foto-t{font-size:10px;color:var(--accent);font-weight:600}
.sel-chk{width:20px;height:20px;margin:2px 0 0;cursor:pointer;accent-color:var(--accent)}
tr.sel-off td:not(:first-child){opacity:.45}
.rs{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rs-g{border-bottom:1px solid var(--line)}.rs-g>summary{list-style:none;display:flex;gap:8px;align-items:center;padding:12px;cursor:pointer}.rs-g>summary::-webkit-details-marker{display:none}
.rs-g>summary span:first-child{flex:1}.rs-g>summary .num{font-weight:600}.rs-chev{color:var(--muted);font-size:13px;transition:transform .15s}.rs-g[open] .rs-chev{transform:rotate(180deg)}
.rs-g>.mc{margin:0 10px 10px}.rs-tot{display:flex;justify-content:space-between;padding:12px;font-weight:700;background:var(--surface-2)}
.mc{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
.mc-f{display:flex;gap:8px;align-items:flex-start;padding:10px;border-top:1px solid var(--line)}.mc-f:first-child{border-top:0}
.mc-t{flex:1;min-width:0;display:grid;gap:2px}.mc-aj{padding:4px 8px;flex:none}
.mc-seg{display:flex;flex-wrap:nowrap;margin-top:6px;max-width:280px}.mc-seg button{flex:1;min-height:34px;padding:6px}
.area-seg{margin-bottom:12px}.area-seg button{font-weight:700}
.it-cel{display:flex;gap:10px;align-items:center;margin-top:6px}.it-thumb{flex:none;width:100px;height:70px;display:grid;place-items:center;border-radius:6px;background:var(--surface-2);overflow:hidden;padding:3px}
.it-thumb svg{width:100%;height:100%;display:block}
.vgc{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}.vgc:first-of-type{border-top:0}
.it-mas{display:flex;align-items:center;justify-content:center;margin:0 0 6px auto;width:38px;height:30px;padding:0}
.lp{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lote{display:grid;gap:6px}
.lote-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 46px minmax(0,1.3fr) 34px;gap:5px;align-items:center}
.lote-r .cin{width:100%;min-width:0;padding:8px 6px}.lote-r .btn{padding:6px 0;min-height:36px}
.lote.con-d .lote-r{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px 50px minmax(0,1.2fr) 32px}
.lote-d{padding:6px 2px!important;font-size:13px}
.lote-x{display:grid;gap:4px;padding:8px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);font-size:13px}
.lote.con-v .lote-r{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 44px minmax(0,1.6fr) 32px}
.vr-l{display:grid;gap:6px}.vr{display:grid;gap:3px;padding-bottom:6px;border-bottom:1px solid var(--line)}.vr-new{border-bottom:0}
.vr-g{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 54px 36px;gap:6px;align-items:center}
.vchips{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;align-items:flex-start}
.vchip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.vchip-n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700}.vchip-m{font-family:var(--f-mono,monospace);font-weight:600}.vchip-q{font-weight:700;color:var(--accent)}.vchip-u{font-size:12px;color:var(--muted)}.vchip-v{font-size:12px;color:var(--muted)}
.vchip.off{opacity:.45;text-decoration:line-through}.vchip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.vchip-src{opacity:.3}.vchip-ghost{position:fixed;z-index:999;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:.95}
.vg.drop{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.vr-n{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 54px 44px!important}.vr-e{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 54px!important}
.vg{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--surface)}
.vg-h{display:flex;align-items:center;gap:8px}.vg-h b{flex:none}.vg-sub{flex:1;text-align:right;font-weight:700}.vg-h .btn{padding:6px 8px;min-height:34px}.vg-sel{width:100%;font-weight:600}
.vr-g .cin{width:100%;min-width:0;padding:8px 6px}.vr-g .btn{padding:6px 0;min-height:36px}.vr-info{padding-left:27px}
.vr.sel-off .vr-g .cin{opacity:.45}
.lote-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lamopc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lamopc-b{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;font-size:12px;color:inherit;cursor:pointer}

/* Número a letras (pesos colombianos) */
function letras(n){
  n=Math.round(n);if(n===0)return"CERO";
  const U=["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE","VEINTIUNO","VEINTIDÓS","VEINTITRÉS","VEINTICUATRO","VEINTICINCO","VEINTISÉIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE"];
  const D=["","","","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
  const C=["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  const tres=x=>{if(x===0)return"";if(x===100)return"CIEN";const c=Math.floor(x/100),r=x%100;let s=C[c];
    if(r){s+=(s?" ":"")+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?" Y "+U[r%10]:""))}return s};
  const apoc=s=>s.replace(/VEINTIUNO$/,"VEINTIÚN").replace(/UNO$/,"UN");
  const mm=Math.floor(n/1e6),resto=n%1e6,mil=Math.floor(resto/1000),u=resto%1000;let out=[];
  if(mm){if(mm===1)out.push("UN MILLÓN");else{const mmM=Math.floor(mm/1000),mmU=mm%1000;let s="";if(mmM)s=(mmM===1?"":apoc(tres(mmM))+" ")+"MIL";if(mmU)s+=(s?" ":"")+apoc(tres(mmU));out.push(s+" MILLONES")}}
  if(mil)out.push(mil===1?"MIL":apoc(tres(mil))+" MIL");
  if(u)out.push(tres(u));
  let s=apoc(out.join(" "));if(mm&&!resto)s+=" DE";return s;
}

/* Tablero de la puerta (mm): ancho, alto, cuántos lleva, material y ancho útil de cada pieza */
function tableroPta(it){const A=it.ancho||0,H=it.alto||0,pc=S.cfg.puertas;
  if(it.tipo==="p1"){const mat=it.tab1||"f06";return {bw:A-110,bh:(H-155)/2,n:2,mat,util:mat==="f06"?pc.utilF06*10:mat==="cielo"?pc.cielo.ancho*10:0}}

/* Piezas de un tablero: horizontal = piezas al ancho apiladas en el alto; vertical = piezas al alto */
function piezasTab(tb,orient){if(!(tb.util>0)||tb.bw<=0||tb.bh<=0)return {cant:0,largo:0};const hz=orient!=="V";
  return {cant:Math.ceil((hz?tb.bh:tb.bw)/tb.util-1e-9),largo:hz?tb.bw:tb.bh}}
/* Acomoda rectángulos en láminas (corte guillotina, permite girar). Devuelve las láminas usadas. */
/* Acomoda rectángulos en láminas con cortes de guillotina (permite girar las piezas).
   Prueba varias formas de ordenar, elegir hueco y partir el sobrante, y se queda con la que
   usa menos láminas y deja los sobrantes más grandes y en una sola pieza. */
function packUna(rects,W,H,orden,elegir,partir){
  const list=rects.slice().sort(orden),sheets=[];
  const lugar=(s,r)=>{let best=null;for(let k=0;k<s.free.length;k++){const f=s.free[k];
      for(const [w,h] of [[r.w,r.h],[r.h,r.w]]){if(w>f.w+1e-6||h>f.h+1e-6)continue;
        const sc=elegir==="primero"?k:elegir==="area"?f.w*f.h-w*h:elegir==="corto"?Math.min(f.w-w,f.h-h):f.y*1e6+f.x;
        if(!best||sc<best.sc)best={k,w,h,sc};if(elegir==="primero")break}if(best&&elegir==="primero")break}return best};
  const poner=(s,r,b)=>{const f=s.free.splice(b.k,1)[0],{w,h}=b,rw=f.w-w,rh=f.h-h;
    const horiz=partir==="corto"?rw<rh:partir==="largo"?rw>=rh:partir==="area"?rw*f.h<rh*f.w:false;

      cx+=tw+gap}}
  else if(TIPOS[it.tipo]?.puerta){const tb=tableroPta(it),pz=piezasTab(tb,it.orient),nl=tb.mat==="marmo"?0:Math.min(40,pz.cant),fl='fill="var(--surface)"';
    const lines=(bx,by,bw,bh)=>{let l="";for(let k=1;k<nl;k++)l+=it.orient==="V"?`<line x1="${bx+bw*k/nl}" y1="${by}" x2="${bx+bw*k/nl}" y2="${by+bh}" ${s} stroke-width=".7"/>`:`<line x1="${bx}" y1="${by+bh*k/nl}" x2="${bx+bw}" y2="${by+bh*k/nl}" ${s} stroke-width=".7"/>`;return l};

  else if(it.tipo==="pasamanos"){inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${glass} ${s} stroke-width="2"/>`+[[8,8],[w-8,8],[8,h-8],[w-8,h-8]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="3" fill="none" ${s}/>`).join("")}
  else{inner=`<rect x="${x+5}" y="${y+5}" width="${w-10}" height="${h-10}" ${glass} ${s} stroke-width="2"/>`}
  const frame=it.tipo==="pasamanos"||it.tipo==="cocina"?"":`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" ${s} stroke-width="3"/>`;

  <text x="${x+w/2}" y="${y+h+18}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--muted)">${it.tipo==="cocina"?tramosCocina(it).map(cm).join(" + "):cm(it.ancho||0)} cm</text>

/* ============ Almacenamiento ============ */
const COLS=["clientes","obras","cobros","borradores"];
async function guardar(col,id,data){
  if(S.readonly){toast("No tienes permiso para guardar.");throw new Error("readonly")}
  data={...data,id,actualizado:new Date().toISOString(),por:S.user?.email||""};
  const arr=S[col],i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=data;else arr.push(data);
  if(S.db)S.db.collection(col).doc(id).set(stripId(data)).catch(errGuardar);else saveLocal();
  return data;
}
async function borrar(col,id){S[col]=S[col].filter(x=>x.id!==id);if(S.db)S.db.collection(col).doc(id).delete().catch(errGuardar);else saveLocal()}
async function guardarCfg(cfg){S.cfg=cfg;S.cfgExists=true;if(S.db)S.db.doc("config/general").set(clone(cfg)).catch(errGuardar);else saveLocal()}
function stripId(d){const o={...d};delete o.id;return JSON.parse(JSON.stringify(o))}
function errGuardar(e){
  if(e&&e.code==="permission-denied"){S.readonly=true;toast("Tu usuario no tiene permiso para guardar. Pide que te agreguen en las reglas de Firebase.")}
  else if(e&&e.code==="resource-exhausted")toast("Se llenó la cuota gratuita de hoy. Intenta mañana.");
  else toast("No se pudo guardar en la nube: "+(e?.message||"error"));
  setSync();
}
function saveLocal(){try{localStorage.setItem("alumel-local",JSON.stringify({cfg:S.cfg,clientes:S.clientes,obras:S.obras,cobros:S.cobros,borradores:S.borradores}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("alumel-local")||"null");if(d){S.cfg=migrarCfg(mergeCfg(DEFAULT_CFG,d.cfg||{}));S.clientes=d.clientes||[];S.obras=d.obras||[];normEstados();S.cobros=d.cobros||[];S.borradores=d.borradores||[]}}catch(e){}}
function setSync(){const el=$("#sync");if(!el)return;
  if(S.offline){el.textContent="Solo este equipo";el.className="sync err";return}
  if(S.readonly){el.textContent="Sin permiso";el.className="sync err";return}
  if(!navigator.onLine){el.textContent="Sin señal · guardando aquí";el.className="sync err";return}
  if(S.pendientes){el.textContent="Sincronizando…";el.className="sync";return}
  const all=["config",...COLS].every(k=>S.loaded[k]);el.textContent=all?"● Sincronizado":"Cargando…";el.className="sync"}
window.addEventListener("online",setSync);window.addEventListener("offline",setSync);

function firebaseListo(){const c=window.ALUMEL_FIREBASE;return !!(window.firebase&&c&&c.apiKey&&!/PEGAR/.test(c.apiKey))}
async function iniciar(){
  if(!firebaseListo()){S.offline=true;loadLocal();S.view=S.view||"obras";setSync();render();return}
  firebase.initializeApp(window.ALUMEL_FIREBASE);
  const db=firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  S.auth=firebase.auth();
  S.view="cargando";render();
  S.auth.onAuthStateChanged(u=>{
    if(!u){S.user=null;S.db=null;(S.unsubs||[]).forEach(f=>f());S.unsubs=[];S.view="login";render();return}
    S.user=u;S.db=db;S.readonly=false;if(S.view==="login"||S.view==="cargando")S.view="obras";render();conectar(db)});
}
function conectar(db){
  S.unsubs=[];S.loaded={};
  const timer=setTimeout(()=>{if(!["config",...COLS].every(k=>S.loaded[k]))setSync()},10000);
  const done=k=>{S.loaded[k]=true;if(["config",...COLS].every(x=>S.loaded[x]))clearTimeout(timer);setSync()};
  const err=k=>e=>{done(k);if(e.code==="permission-denied"){S.readonly=true;setSync();toast("Tu usuario no tiene permiso. Pide que te agreguen.")}};
  S.unsubs.push(db.doc("config/general").onSnapshot({includeMetadataChanges:true},snap=>{S.cfgExists=snap.exists;S.cfg=migrarCfg(snap.exists?mergeCfg(DEFAULT_CFG,snap.data()):clone(DEFAULT_CFG));done("config");softRender()},err("config")));
  for(const col of COLS){
    S.unsubs.push(db.collection(col).onSnapshot({includeMetadataChanges:true},snap=>{S[col]=snap.docs.map(d=>({...d.data(),id:d.id}));if(col==="obras")normEstados();S.pendientes=snap.metadata.hasPendingWrites;done(col);softRender()},err(col)));
  }
}

function pagosObra(o){const tot=totalObra(o),abO=(o.abonos||[]).reduce((s,a)=>s+(+a.valor||0),0),
  abC=S.cobros.filter(c=>c.obraId===o.id&&!c.anulada).reduce((s,c)=>s+saldoCobro(c).ab,0),pagado=abO+abC;return {tot,abO,abC,pagado,debe:Math.max(0,tot-pagado)}}

async function subirLocales(){const L=datosLocales();if(!L)return;const d=L.d;let ren=0;

/* ===== Precios faltantes: un ítem no se cotiza mientras falte algún precio de lo que usa ===== */
function faltanItem(it){if(!it||it.fuera||it.precioManual>0)return [];const F=new Set(),cfg=S.cfg,z=v=>!(+v>0),dp=despiece({...it,cant:1});
  if(TIPOS[it.tipo]?.serie){const sc=cfg.series[it.tipo];for(const p of dp.perfiles){const r=sc.perfiles.find(x=>x.nombre===p.nombre);if(!r||z(r.precio))F.add(TIPOS[it.tipo].corto+" · "+p.nombre)}
    for(const [n,c] of dp.acc){if(!(c>0))continue;if(n.startsWith("Rodamientos")&&z(precioRod(it.tipo,it.rod)))F.add("Rodamiento "+(it.rod==="abb"?"ABB":"nylon")+" "+TIPOS[it.tipo].corto);if(n.startsWith("Empaque")&&z(cfg.empaqueMl))F.add("Empaque")}
    if(dp.vidrios.length&&z(vidrioDe(it.vidrio).m2))F.add("Vidrio "+vidrioDe(it.vidrio).nombre)}
  else if(TIPOS[it.tipo]?.puerta){for(const p of dp.perfiles){if(p.pool==="cielo"){if(z(cfg.puertas.cielo.precio))F.add("Tira PVC cielorraso");continue}if(z(cfg.puertas.perfiles[p.ref]))F.add(p.ref)}
    for(const [n,c,k] of dp.acc)if(k&&c>0&&z(precioAccPta(k)))F.add(n.replace(/ \(m\)/,""));if(dp.tab.length&&z(cfg.puertas.marmo.precio))F.add("Lámina PVC marmolizado")}
  else if(esMel(it)){const ml=cfg.melamina,cs=new Set(dp.mel.map(p=>p.color));for(const c of cs)if(z(precioMel(c)))F.add("Lámina melamina "+c);if(dp.fon.length&&z(ml.fondoPrecio))F.add("Lámina fondo 3 mm");
    for(const [n,c,k] of dp.acc){if(!k||!(c>0))continue;if(k==="canto"){if(z(it.canto==="rigido"?ml.cantoRigido:ml.cantoFlex))F.add("Canto "+(it.canto==="rigido"?"rígido":"flex"))}else if(z(cfg.cocina[k]))F.add(n.replace(/ \(.*\)/,""))}}
  else if(it.tipo==="cocina"){const cc=cfg.cocina;for(const p of dp.perfiles){const v=p.ref==="naveDucha"?cc.naveDucha:p.ref==="a15"?cc.a15:p.ref==="T78"?cc.t78:cfg.puertas.perfiles[p.ref];if(z(v))F.add(p.ref==="naveDucha"?"Nave de ducha":p.ref==="a15"?"A15":p.ref)}
    if(dp.tab.length&&z(cfg.puertas.marmo.precio))F.add("Lámina PVC marmolizado");for(const [n,c,k] of dp.acc)if(k&&c>0&&z(cc[k]))F.add(n.replace(/ \(.*\)/,""))}
  else if(it.tipo==="vidrio"){if(z(vidrioDe(it.vidrio).m2))F.add("Vidrio "+vidrioDe(it.vidrio).nombre)}
  else if(it.tipo==="division"){const r=vidriosDivision(it);if(z(precioDivM2(r)))F.add(r.modo==="especial"?"Vidrio templado a la medida (m²)":"Vidrio templado (m²)");if(z(cfg.division.accesorios))F.add("Accesorios división")}
  return [...F]}
function faltanItems(items){const F=new Set();for(const it of items||[])faltanItem(it).forEach(x=>F.add(x));return [...F]}
function seccionFalta(f){if(/melamina|fondo 3|Canto/i.test(f))return "aj-melamina";if(/^Vidrio templado/.test(f))return "aj-templados";
  if(/PVC marmolizado|cielorraso/i.test(f))return "aj-pvc";if(/^Vidrio /.test(f))return "aj-vidrios";
  // lo que es una referencia de perfil va a Perfiles; todo lo demás (chapas, bisagras, empaques…) a Accesorios
  return /^[A-Z]{1,2}\d+$|^Nave de ducha$| · /.test(f)?"aj-perfiles":"aj-accesorios"}
function avisoFaltan(F){const sec=[...new Set(F.map(seccionFalta))];

/* ============ Firma ============ */
/* Recorta lo blanco alrededor, vuelve transparente el fondo claro y la deja en tinta oscura */
function procesarFirma(src){const W=src.width,H=src.height,cx=src.getContext("2d"),d=cx.getImageData(0,0,W,H),p=d.data;let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=(y*W+x)*4,lum=(p[k]*0.3+p[k+1]*0.59+p[k+2]*0.11),a=p[k+3];
    if(a<10||lum>165){p[k+3]=0}else{p[k]=16;p[k+1]=35;p[k+2]=58;p[k+3]=Math.min(255,a*(1-lum/255)*2.2+60);if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return null;cx.putImageData(d,0,0);const m=6;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(W-1,x1+m);y1=Math.min(H-1,y1+m);
  const w=x1-x0+1,h=y1-y0+1,sc=Math.min(1,600/w),out=document.createElement("canvas");out.width=Math.round(w*sc);out.height=Math.max(1,Math.round(h*sc));
  out.getContext("2d").drawImage(src,x0,y0,w,h,0,0,out.width,out.height);return {url:out.toDataURL("image/png"),ratio:out.width/out.height}}
function guardarFirma(r){if(!r){toast("No se encontró la firma en la imagen");return false}const c=S.cfgEdit||(S.cfgEdit=clone(S.cfg));c.empresa.firma=r.url;c.empresa.firmaRatio=r.ratio;
  S.cfgTimer=1;guardarCfgYa();toast("Firma guardada");return true}
function firmaSheet(){openSheet(()=>`<div class="sheet-h"><h2>Dibuja tu firma</h2><button class="btn sm" data-act="cerrar">Cerrar</button></div>
  <span class="small muted">Firma con el dedo dentro del recuadro. Gira el teléfono si necesitas más espacio.</span>
  <canvas id="firma-pad" style="width:100%;height:200px;background:#fff;border:1.5px dashed var(--line);border-radius:8px;touch-action:none"></canvas>
  <div class="row"><button class="btn grow" data-act="firma-limpiar">Borrar</button><button class="btn pri grow" data-act="firma-ok">Guardar firma</button></div>`);
  const cv=$("#firma-pad"),r=cv.getBoundingClientRect(),dpr=Math.max(2,window.devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.6;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#10233a";S.firmaTrazo=false;let dn=false,lx=0,ly=0;
  const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener("pointerdown",e=>{dn=true;try{cv.setPointerCapture(e.pointerId)}catch(er){}[lx,ly]=pos(e);g.beginPath();g.arc(lx,ly,1.2,0,7);g.fillStyle="#10233a";g.fill();S.firmaTrazo=true});
  cv.addEventListener("pointermove",e=>{if(!dn)return;const [x,y]=pos(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y});
  const up=()=>{dn=false};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up)}

/* ============ Lista de materiales (para comprar) ============ */
const mts=mm=>(Math.round(mm/10)/100).toFixed(2).replace(".",",")+" m";
function listaMateriales(items){const res=sumarDespiece(items),L=S.cfg.barra||6000,G=[];
  // Perfiles: tiras completas + lo que se usa de la última
  const per=res.per.filter(p=>p.nombre!=="PVC cielorraso").map(p=>{const bs=barras(p.cortes,kerfDe(p)),llenas=bs.filter(b=>!b.over).length-1,ult=bs[bs.length-1];
    const n=Math.max(0,llenas),resto=ult&&!ult.over?ult.used:0,lleno=resto>L*0.98;
    return {t:p.nombre+(p.color?" · "+p.color:""),g:p.sistema,v:(lleno?n+1:n)?((lleno?n+1:n)+" tira"+((lleno?n+1:n)===1?"":"s")+(lleno?"":" + "+mts(resto))):mts(resto),tiras:bs.length}}).sort((a,b)=>a.g.localeCompare(b.g)||a.t.localeCompare(b.t));
  if(per.length)G.push({h:"Perfiles",filas:per.map(p=>[p.g+" · "+p.t,p.v,p.tiras+" tira"+(p.tiras===1?"":"s")+" para cortar"])});
  // PVC cielorraso
  const cie=res.per.find(p=>p.nombre==="PVC cielorraso");if(cie){const c=S.cfg.puertas.cielo,lst=[];cie.cortes.forEach(x=>{for(let k=0;k<x.cant;k++)lst.push(x.largo)});const n=tirasNecesarias(lst,c.largo*10);G.push({h:"PVC cielorraso",filas:[["Tira "+c.ancho+" × "+c.largo+" cm",n+" tira"+(n===1?"":"s"),lst.length+" piezas"]]})}
  // PVC marmolizado
  const r=[];res.pvc.forEach(p=>{for(let k=0;k<p.cant;k++)r.push({w:p.ancho,h:p.alto})});if(r.length){const m=S.cfg.puertas.marmo,l=laminasMarmo(r,true),le=laminasMarmo(r,false);
    G.push({h:"PVC marmolizado",filas:[["Lámina "+m.ancho+" × "+m.alto+" cm",le.laminas+" lámina"+(le.laminas===1?"":"s"),(l.media?"(se usa "+String(l.laminas).replace(".",",")+") · ":"")+r.length+" piezas"]]})}
  // Melamina y fondo
  {for(const {g,t,W,H,media} of gruposLam(res.mel||[])){const L=(res.mel||[]).filter(x=>x.g===g);if(!L.length)continue;
    const r=[];L.forEach(p=>{for(let k=0;k<p.cant;k++)r.push({w:p.ancho,h:p.alto})});const cl=contarLaminas(r,W*10,H*10,media,kerfMel()),ent=Math.floor(cl.n);
    G.push({h:t,filas:[["Lámina "+W+" × "+H+" cm",cl.media?(ent?ent+" lámina"+(ent===1?"":"s")+" + media":"Media lámina"):txtLam(cl.n),r.length+" piezas"]]})}}
  // Vidrio
  if(res.vid.length){const by={};for(const v of res.vid){const k=v.vidrio;(by[k]=by[k]||{m2:0,n:0,l:{}});by[k].m2+=v.ancho*v.alto*v.cant/1e6;by[k].n+=v.cant;const z=cm(v.ancho)+" × "+cm(v.alto);by[k].l[z]=(by[k].l[z]||0)+v.cant}
    G.push({h:"Vidrio",filas:Object.entries(by).map(([k,v])=>[k,v.m2.toFixed(2).replace(".",",")+" m²",v.n+" piezas: "+Object.entries(v.l).map(([z,n])=>n+" de "+z).join(", ")])})}
  // Accesorios
  const acc=res.acc.filter(([n,c])=>c>0).map(([n,c])=>{const mt=/\(m\)/.test(n);return [n.replace(/ \(m\)/,""),mt?String(Math.ceil(c*10)/10).replace(".",",")+" m":String(c),""]});
  if(acc.length)G.push({h:"Accesorios",filas:acc});
  return G}
function materialesSheet(id){const o=id==="__draft"?S.draft:obra(id);if(!o)return;const G=listaMateriales(o.items||[]);S.matTxt=textoMateriales(o,G);

/* Entregar un archivo: verlo en pantalla, descargarlo o compartirlo (WhatsApp, correo…) */
async function entregarArchivo(nombre,blob){

  if(S.archivo?.url)URL.revokeObjectURL(S.archivo.url);S.archivo={f,nombre,url:URL.createObjectURL(blob)};
  const movil=matchMedia("(pointer:coarse)").matches,pdf=blob.type==="application/pdf";
  const ver=pdf?`<a class="btn ${movil?"":"pri"} grow" href="${S.archivo.url}" target="_blank" rel="noopener">Ver PDF</a>`:"";
  const comp=puede?`<button class="btn ${movil?"pri":""} grow" data-act="compartir-archivo">Compartir</button>`:"";

   <div class="row" style="gap:8px;flex-wrap:wrap">${movil?comp+ver:ver+comp}<a class="btn grow" href="${S.archivo.url}" download="${esc(nombre)}">Descargar</a></div>

/* El PDF usa fuentes básicas: cambia los símbolos que no soportan (″, ′, comillas tipográficas, etc.) */
function pdfLimpio(t){if(Array.isArray(t))return t.map(pdfLimpio);if(typeof t!=="string")return t;
  return t.replace(/[″“”]/g,'"').replace(/[′‘’]/g,"'").replace(/[–—]/g,"-").replace(/…/g,"...").replace(/✓/g,"").replace(/\u00a0/g," ").replace(/[^\x00-\xff]/g,"")}

  if(t.dataset.vrMover!==undefined&&S.draft){const it=S.draft.items[+t.dataset.vrMover];if(it&&t.value){let gid=t.value;if(gid==="nuevo"){const g={id:uid(),vidrio:vidSigVidrio(S.draft)};S.draft.grupos.push(g);gid=g.id}
    it.g=gid;S.vrOpen={};vidGrupos(S.draft);vidPanel();toast("Medida movida")}return}
  if(t.dataset.vr&&S.draft){const [ix,f]=t.dataset.vr.split("."),val=f==="ancho"||f==="alto"?Math.round(num(t.value)*10):f==="cant"?Math.max(1,Math.round(num(t.value))||1):f==="instalacion"?(t.value.trim()===""?null:Math.round(num(t.value))):t.value;
    if(ix[0]==="n"){if(f==="cant")return;const gid=ix.slice(1),g=(S.draft.grupos||[]).find(x=>x.id===gid);if(!g)return;const it={tipo:"vidrio",g:gid,cant:Math.max(1,Math.round(num($("#vr-n"+gid+"-cant")?.value))||1),vidrio:g.vidrio,ancho:0,alto:0,ubicacion:"",precioManual:0};it[f]=val;S.draft.items.push(it);S.ultVidrio=g.vidrio;
      const k=S.draft.items.length-1,pos=t.selectionStart;$("#vid-items").innerHTML=vidItemsHtml(S.draft,calcCot(S.draft.items,S.draft));const e=document.getElementById("vr-"+k+"-"+f);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(er){}}vidRefrescar();return}
    const it=S.draft.items[+ix];if(!it)return;if(val===null)delete it[f];else it[f]=val;if(f==="vidrio")S.ultVidrio=val;vidRefrescar();return}
  if(t.dataset.lote&&S.itemTmp?.lote){const [i,f]=t.dataset.lote.split("."),L=S.itemTmp.lote,r=L[+i];if(!r)return;
    r[f]=f==="u"||f==="v"?t.value:f==="i"?(t.value.trim()===""?"":Math.round(num(t.value))):f==="c"?Math.round(num(t.value)):Math.round(num(t.value)*10);
    if(+i===L.length-1&&(r.a>0||r.h>0)){L.push({a:0,h:0,c:1,u:"",...(r.d?{d:r.d}:{}),...(r.v?{v:r.v}:{})});refreshSheet()}
    else{const e=$("#lote-res");if(e)e.innerHTML=loteRes(S.itemTmp);const g=$('[data-act="guardar-item"]');if(g)g.textContent="Agregar "+loteItems(S.itemTmp).length+" ítem(s) a la cotización"}return}
  if(t.dataset.it&&S.itemTmp){const k=t.dataset.it;let v=t.type==="checkbox"?t.checked:t.value;
    if(k==="ancho"||k==="alto"||k==="ancho2"||k==="ancho3"||k==="fondo")v=Math.round(num(v)*10);else if(k==="cant"||k==="precioManual"||k==="instalacion"||k==="acero"||k==="vidrioTpl"||/^np\d$/.test(k))v=Math.round(num(v));else if(k==="recargo")v=num(v);
    S.itemTmp[k]=v;const it=S.itemTmp;
    const calc=$("#it-calc");if(calc)calc.innerHTML=calcHtml(it);
    const sk=$(".sheet .sketch");if(sk)sk.innerHTML=sketch(it);const lr=$("#lote-res");if(lr&&it.loteOn)lr.innerHTML=loteRes(it);return}
  if(t.dataset.cfg&&S.cfgEdit){const path=t.dataset.cfg.split(".");let o=S.cfgEdit;for(let i=0;i<path.length-1;i++)o=o[path[i]];const k=path[path.length-1];
    o[k]=(typeof o[k]==="number")?num(t.value):t.value;autoGuardarCfg();return}
  if(t.id==="cb-valor"){const h=$("#cb-letras");if(h){const v=Math.round(num(t.value));h.textContent=v?letras(v)+" PESOS M/CTE":""}return}
  if(t.dataset.buscarObra!==undefined){S.buscarObra=t.value;const pos=t.selectionStart;render();const nb=$("#buscar-obra");nb.focus();try{nb.setSelectionRange(pos,pos)}catch(e){}return}
  if(t.dataset.buscar!==undefined){S.buscar=t.value;const pos=t.selectionStart;render();const nb=$("#buscar");nb.focus();try{nb.setSelectionRange(pos,pos)}catch(e){}}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.dataset&&t.dataset.itInst!==undefined&&S.draft){const it=S.draft.items[+t.dataset.itInst];if(it){it.instalacion=Math.round(num(t.value));render()}return}
  if(t.dataset&&t.dataset.perfimg!==undefined&&t.files&&t.files[0]){const key=t.dataset.perfimg,fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,240/Math.max(im.width,im.height)),cv=document.createElement("canvas");
      cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
      const c=S.cfgEdit||(S.cfgEdit=clone(S.cfg));c.perfilImg={...(c.perfilImg||{}),[key]:cv.toDataURL("image/jpeg",0.82)};S.cfg.perfilImg=c.perfilImg;autoGuardarCfg();render();toast("Foto del perfil guardada")};im.src=fr.result};fr.readAsDataURL(t.files[0]);t.value="";return}
  if(t.id==="firma-file"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1400/im.width),cv=document.createElement("canvas");
      cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);if(guardarFirma(procesarFirma(cv)))render()};im.src=fr.result};fr.readAsDataURL(t.files[0]);t.value=""}
  if(t.id==="imp-file"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="alumel")throw 0;
    confirmar("Se agregarán o reemplazarán "+(d.clientes||[]).length+" clientes, "+(d.obras||[]).length+" obras y "+(d.cobros||[]).length+" cuentas de cobro del respaldo.","Importar",async()=>{
      if(d.cfg)await guardarCfg(migrarCfg(mergeCfg(DEFAULT_CFG,d.cfg)));for(const col of COLS)for(const x of (d[col]||[]))await guardar(col,x.id||uid(),x);toast("Respaldo importado")})}catch(e){toast("Ese archivo no es un respaldo de Alumel")}};r.readAsText(t.files[0]);t.value=""}
  if(t.dataset.actChange==="cortes-obra"){S.cortesObra=t.value;render()}
  if(t.id==="cb-obra"&&t.value){const o=obra(t.value);if(o&&!$("#cb-cli").value)$("#cb-cli").value=o.clienteId||""}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&sheetFn)closeSheet();
  if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.vn){ev.preventDefault();const f=ev.target.dataset.f,g=ev.target.dataset.vn;if(f==="ancho"){$("#vn-"+g+"-alto")?.focus()}else vnAgregar(g)}});

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
iniciar();
</script>
