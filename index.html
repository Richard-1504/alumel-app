<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cinzel:wght@500;600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de taller — encabezado fijo, contenido de una columna (máx 920px), barra inferior de pestañas. Aluminio anodizado + verde de canto de vidrio. */
:root{
  --bg:#f3f1ee;          /* fondo cálido claro */
  --surface:#ffffff;
  --surface-2:#ebe6e0;
  --line:#d8d0c7;
  --fg:#1f1a17;
  --muted:#6a5f58;
  --accent:#9a6430;      /* cobre de la marca */
  --accent-ink:#ffffff;
  --accent-soft:#f3e6d8;
  --metal:#17130f;       /* negro de la marca */
  --metal-ink:#efe7df;
  --glass:#dbe9ef;
  --ok:#237a3b; --ok-soft:#dcefe0;
  --warn:#9a6200; --warn-soft:#f6ead2;
  --bad:#b23a2e; --bad-soft:#f7dedb;
  --info:#2f5f9e; --info-soft:#dde7f5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-brand:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12100e;--surface:#1b1815;--surface-2:#25211d;--line:#3a332c;--fg:#efe9e3;--muted:#a89c91;
  --accent:#d4a373;--accent-ink:#1a120a;--accent-soft:#3a2a1c;--metal:#0b0908;--metal-ink:#efe7df;--glass:#1d2a30;
  --ok:#6cc483;--ok-soft:#18321f;--warn:#e0aa4a;--warn-soft:#352812;--bad:#ec7b6f;--bad-soft:#3a1c19;--info:#7fa9e6;--info-soft:#1a2a40;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12100e;--surface:#1b1815;--surface-2:#25211d;--line:#3a332c;--fg:#efe9e3;--muted:#a89c91;
  --accent:#d4a373;--accent-ink:#1a120a;--accent-soft:#3a2a1c;--metal:#0b0908;--metal-ink:#efe7df;--glass:#1d2a30;
  --ok:#6cc483;--ok-soft:#18321f;--warn:#e0aa4a;--warn-soft:#352812;--bad:#ec7b6f;--bad-soft:#3a1c19;--info:#7fa9e6;--info-soft:#1a2a40;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--metal)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--metal);color:var(--metal-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{height:38px;width:auto;flex:none}
.brand-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand b{font:600 22px/1 var(--f-brand);letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(180deg,#f3e3d0 0,#d4a373 55%,#b07a45 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font:500 10px/1 var(--f-mono);color:#a89c91;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-bar{height:5px;max-width:920px;margin:8px auto 0;border-radius:2px;
  background:linear-gradient(90deg,#8e8e8e 0,#e6e6e6 30%,#c9c9c9 48%,#d4a373 52%,#f0cfa8 72%,#a8713e 100%)}
.icon-btn{background:transparent;border:1px solid #4a4038;color:var(--metal-ink);border-radius:8px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.icon-btn:hover{border-color:#a8713e}
.sync{font:500 11px/1 var(--f-mono);color:#a89c91;white-space:nowrap}
.sync.err{color:#f0a097}

/* Main */
main{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:17px;font-weight:600}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat .v{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:6px;word-break:break-word}
@media (max-width:420px){.stat .v{font-size:19px}}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dark{background:var(--metal);color:var(--metal-ink);border-color:var(--metal)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}

/* Chips & pills */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--metal);color:var(--metal-ink);border-color:var(--metal)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-cot{background:var(--info-soft);color:var(--info)}
.st-apr{background:var(--accent-soft);color:var(--accent)}
.st-pro{background:var(--warn-soft);color:var(--warn)}
.st-ins{background:var(--warn-soft);color:var(--warn)}
.st-ent{background:var(--ok-soft);color:var(--ok)}
.st-pag{background:var(--ok-soft);color:var(--ok)}
.st-par{background:var(--warn-soft);color:var(--warn)}
.st-pen{background:var(--bad-soft);color:var(--bad)}
.st-anu{background:var(--surface-2);color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600}
.li .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.04em}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 10px;background:var(--surface-2);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface-2)}

/* Forms */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px;min-height:44px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer;flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.note{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--fg);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.info{border-color:var(--info);background:var(--info-soft)}
.total-bar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--metal);color:var(--metal-ink);border-radius:var(--r);padding:14px 16px}
.total-bar .v{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* Window sketch */
.sketch{display:flex;justify-content:center;background:var(--surface-2);border-radius:8px;padding:10px}
.sketch svg{max-width:100%;height:auto}

/* Bars (despiece) */
.bar{display:flex;height:26px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.bar .cut{background:var(--metal);color:var(--metal-ink);font:500 10px/26px var(--f-mono);text-align:center;overflow:hidden;white-space:nowrap;border-right:2px solid var(--bg);min-width:0}
.bar .cut:nth-child(even){background:color-mix(in srgb,var(--metal) 78%,var(--accent))}
.barline{display:grid;grid-template-columns:56px minmax(0,1fr) 66px;gap:8px;align-items:center;font-size:12px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--bg);padding-block:4px;z-index:2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--metal);color:var(--metal-ink);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.cols2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.cin{border:1px solid var(--line);border-radius:6px;padding:7px;background:var(--surface);font-size:16px;min-height:38px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
</style>

function letras(n){
  n=Math.round(n);if(n===0)return"CERO";
  const U=["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE","VEINTIUNO","VEINTIDÓS","VEINTITRÉS","VEINTICUATRO","VEINTICINCO","VEINTISÉIS","VEINTISIETE","VEINTIOCHO","VEINTINUEVE"];
  const D=["","","","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
  const C=["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  const tres=x=>{if(x===0)return"";if(x===100)return"CIEN";const c=Math.floor(x/100),r=x%100;let s=C[c];
    if(r){s+=(s?" ":"")+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?" Y "+U[r%10]:""))}return s};
  const apoc=s=>s.replace(/VEINTIUNO$/,"VEINTIÚN").replace(/UNO$/,"UN");
  const mm=Math.floor(n/1e6),resto=n%1e6,mil=Math.floor(resto/1000),u=resto%1000;let out=[];
  if(mm){if(mm===1)out.push("UN MILLÓN");else{const mmM=Math.floor(mm/1000),mmU=mm%1000;let s="";if(mmM)s=(mmM===1?"":apoc(tres(mmM))+" ")+"MIL";if(mmU)s+=(s?" ":"")+apoc(tres(mmU));out.push(s+" MILLONES")}}
  if(mil)out.push(mil===1?"MIL":apoc(tres(mil))+" MIL");
  if(u)out.push(tres(u));
  let s=apoc(out.join(" "));if(mm&&!resto)s+=" DE";return s;
}

/* Acomoda rectángulos en láminas (corte guillotina, permite girar). Devuelve las láminas usadas. */

    const lines=(bx,by,bw,bh)=>{let l="";for(let k=1;k<nl;k++)l+=it.orient==="V"?`<line x1="${bx+bw*k/nl}" y1="${by}" x2="${bx+bw*k/nl}" y2="${by+bh}" ${s} stroke-width=".7"/>`:`<line x1="${bx}" y1="${by+bh*k/nl}" x2="${bx+bw}" y2="${by+bh*k/nl}" ${s} stroke-width=".7"/>`;return l};
    const board=(bx,by,bw,bh)=>`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" ${tb.mat==="marmo"?'fill="var(--surface-2)"':fl} ${s} stroke-width="1.2"/>${lines(bx,by,bw,bh)}`;
    inner=`<rect x="${x+4}" y="${y+4}" width="${w-8}" height="${h-8}" fill="none" ${s} stroke-width="2"/>`;
    if(it.tipo==="p1"){const bx=x+9,bw=w-18,bh=(h-18-8)/2;inner+=board(bx,y+9,bw,bh)+`<rect x="${bx}" y="${y+9+bh}" width="${bw}" height="8" fill="currentColor" opacity=".55"/>`+board(bx,y+17+bh,bw,bh)}
    else{const m=it.nave==="t244"?14:9;inner+=board(x+m,y+m,w-2*m,h-2*m)}
    inner+=`<circle cx="${x+w-(it.nave==="t244"&&it.tipo==="p15"?8:6)}" cy="${y+h/2+4}" r="2.6" fill="currentColor"/>`}
  else if(it.tipo==="puerta"){inner=`<rect x="${x+5}" y="${y+5}" width="${w-10}" height="${h/2-8}" ${glass} ${s} stroke-width="2"/><rect x="${x+5}" y="${y+h/2+3}" width="${w-10}" height="${h/2-8}" ${glass} ${s} stroke-width="2"/><circle cx="${x+w-14}" cy="${y+h/2}" r="3" fill="currentColor"/>`}
  else if(it.tipo==="pasamanos"){inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${glass} ${s} stroke-width="2"/>`+[[8,8],[w-8,8],[8,h-8],[w-8,h-8]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="3" fill="none" ${s}/>`).join("")}
  else{inner=`<rect x="${x+5}" y="${y+5}" width="${w-10}" height="${h-10}" ${glass} ${s} stroke-width="2"/>`}
  const frame=it.tipo==="pasamanos"?"":`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" ${s} stroke-width="3"/>`;
  const nq=it.cant||1;
  return `<svg viewBox="0 0 260 ${h+(nq>1?62:44)}" width="260" style="color:var(--fg)">${frame}${inner}${nq>1?`<text x="130" y="${y+h+40}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" fill="currentColor">Cantidad: ${nq}</text>`:""}
  <text x="${x+w/2}" y="${y+h+18}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--muted)">${it.tipo==="cocina"?tramosCocina(it).map(cm).join(" + "):cm(it.ancho||0)} cm</text>
  <text x="${x+w+6}" y="${y+h/2}" font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--muted)" transform="rotate(90 ${x+w+6} ${y+h/2})" text-anchor="middle">${cm(it.alto||0)} cm</text></svg>`;
}

/* ============ Almacenamiento ============ */
const COLS=["clientes","obras","cobros"];
async function guardar(col,id,data){
  if(S.readonly){toast("No tienes permiso para guardar.");throw new Error("readonly")}
  data={...data,id,actualizado:new Date().toISOString(),por:S.user?.email||""};
  const arr=S[col],i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=data;else arr.push(data);
  if(S.db)S.db.collection(col).doc(id).set(stripId(data)).catch(errGuardar);else saveLocal();
  return data;
}
async function borrar(col,id){S[col]=S[col].filter(x=>x.id!==id);if(S.db)S.db.collection(col).doc(id).delete().catch(errGuardar);else saveLocal()}
async function guardarCfg(cfg){S.cfg=cfg;S.cfgExists=true;if(S.db)S.db.doc("config/general").set(clone(cfg)).catch(errGuardar);else saveLocal()}
function stripId(d){const o={...d};delete o.id;return JSON.parse(JSON.stringify(o))}
function errGuardar(e){
  if(e&&e.code==="permission-denied"){S.readonly=true;toast("Tu usuario no tiene permiso para guardar. Pide que te agreguen en las reglas de Firebase.")}
  else if(e&&e.code==="resource-exhausted")toast("Se llenó la cuota gratuita de hoy. Intenta mañana.");
  else toast("No se pudo guardar en la nube: "+(e?.message||"error"));
  setSync();
}
function saveLocal(){try{localStorage.setItem("alumel-local",JSON.stringify({cfg:S.cfg,clientes:S.clientes,obras:S.obras,cobros:S.cobros}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("alumel-local")||"null");if(d){S.cfg=migrarCfg(mergeCfg(DEFAULT_CFG,d.cfg||{}));S.clientes=d.clientes||[];S.obras=d.obras||[];normEstados();S.cobros=d.cobros||[]}}catch(e){}}
function setSync(){const el=$("#sync");if(!el)return;
  if(S.offline){el.textContent="Solo este equipo";el.className="sync err";return}
  if(S.readonly){el.textContent="Sin permiso";el.className="sync err";return}
  if(!navigator.onLine){el.textContent="Sin señal · guardando aquí";el.className="sync err";return}
  if(S.pendientes){el.textContent="Sincronizando…";el.className="sync";return}
  const all=["config",...COLS].every(k=>S.loaded[k]);el.textContent=all?"● Sincronizado":"Cargando…";el.className="sync"}
window.addEventListener("online",setSync);window.addEventListener("offline",setSync);

function firebaseListo(){const c=window.ALUMEL_FIREBASE;return !!(window.firebase&&c&&c.apiKey&&!/PEGAR/.test(c.apiKey))}
async function iniciar(){
  if(!firebaseListo()){S.offline=true;loadLocal();S.view=S.view||"obras";setSync();render();return}
  firebase.initializeApp(window.ALUMEL_FIREBASE);
  const db=firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  S.auth=firebase.auth();
  S.view="cargando";render();
  S.auth.onAuthStateChanged(u=>{
    if(!u){S.user=null;S.db=null;(S.unsubs||[]).forEach(f=>f());S.unsubs=[];S.view="login";render();return}
    S.user=u;S.db=db;S.readonly=false;if(S.view==="login"||S.view==="cargando")S.view="obras";render();conectar(db)});
}
function conectar(db){
  S.unsubs=[];S.loaded={};
  const timer=setTimeout(()=>{if(!["config",...COLS].every(k=>S.loaded[k]))setSync()},10000);
  const done=k=>{S.loaded[k]=true;if(["config",...COLS].every(x=>S.loaded[x]))clearTimeout(timer);setSync()};
  const err=k=>e=>{done(k);if(e.code==="permission-denied"){S.readonly=true;setSync();toast("Tu usuario no tiene permiso. Pide que te agreguen.")}};
  S.unsubs.push(db.doc("config/general").onSnapshot({includeMetadataChanges:true},snap=>{S.cfgExists=snap.exists;S.cfg=migrarCfg(snap.exists?mergeCfg(DEFAULT_CFG,snap.data()):clone(DEFAULT_CFG));done("config");softRender()},err("config")));
  for(const col of COLS){
    S.unsubs.push(db.collection(col).onSnapshot({includeMetadataChanges:true},snap=>{S[col]=snap.docs.map(d=>({...d.data(),id:d.id}));if(col==="obras")normEstados();S.pendientes=snap.metadata.hasPendingWrites;done(col);softRender()},err(col)));
  }
}

function saldoCobro(c){const ab=(c.abonos||[]).reduce((s,a)=>s+(+a.valor||0),0);return {ab,saldo:(+c.valor||0)-ab}}
/* Pagos de una obra: abonos registrados en la obra + abonos de sus cuentas de cobro */
function pagosObra(o){const tot=totalObra(o),abO=(o.abonos||[]).reduce((s,a)=>s+(+a.valor||0),0),
  abC=S.cobros.filter(c=>c.obraId===o.id&&!c.anulada).reduce((s,c)=>s+saldoCobro(c).ab,0),pagado=abO+abC;return {tot,abO,abC,pagado,debe:Math.max(0,tot-pagado)}}

function deudaCliente(id){return S.obras.filter(o=>o.clienteId===id&&!["cotizacion","anulada"].includes(o.estado)).reduce((s,o)=>s+pagosObra(o).debe,0)+
  S.cobros.filter(x=>x.clienteId===id&&!x.anulada&&!obra(x.obraId)).reduce((s,x)=>s+Math.max(0,saldoCobro(x).saldo),0)}

  const n={obras:(d.obras||[]).length,clientes:(d.clientes||[]).length,cobros:(d.cobros||[]).length};return n.obras+n.clientes+n.cobros||d.cfg?{d,n}:null}catch(e){return null}}
async function subirLocales(){const L=datosLocales();if(!L)return;const d=L.d;let ren=0;
  if(d.cfg&&!S.cfgExists)await guardarCfg(migrarCfg(mergeCfg(DEFAULT_CFG,d.cfg)));

  return `<div class="tbl-wrap"><table><thead><tr><th>Ítem</th><th class="n">Medida (cm)</th><th class="n">Cant</th><th class="n">Valor</th>${editable?"<th></th>":""}</tr></thead><tbody>
  ${items.map((it,i)=>`<tr><td><b>${esc(describeItem(it))}</b><div class="small muted">${esc(detalleItem(it))}${TIPOS[it.tipo]?.serie?" · rodamiento "+(it.rod==="abb"?"ABB":"nylon"):""}${it.ubicacion?" · "+esc(it.ubicacion):""}</div></td>
   <td class="n mono">${medidaTxt(it)||"—"}</td><td class="n">${it.cant}</td><td class="n">${money(calc.lineas[i]?.total)}${it.precioManual>0?`<div class="small muted">manual</div>`:""}</td>

function vidriosInvObra(o){const m={};for(const it of o.items||[]){if(it.tipo!=="division"||it.precioManual>0)continue;const r=vidriosDivision(it);
  if(r.modo!=="estandar"||r.sinCatalogo)continue;for(const w of [r.fijo,r.movil]){const k=cm(w)+"x"+cm(it.alto);m[k]=(m[k]||0)+(it.cant||1)}}return m}
async function moverInventario(mapa,signo){const c=clone(S.cfg);const L=c.division.vidrios||[];
  for(const [k,n] of Object.entries(mapa)){const [a,h]=k.split("x").map(x=>num(x));const v=L.find(v=>Math.abs(+v.ancho-a)<0.01&&Math.abs(+v.alto-h)<0.01);if(v)v.stock=Math.max(0,(+v.stock||0)+signo*n)}
  await guardarCfg(c);if(S.cfgEdit)S.cfgEdit=null}

function ptaInfo(it,c){
  const tb=tableroPta(it),pc=S.cfg.puertas,dp=despiece({...it,cant:1});
  if(tb.bw<=0||tb.bh<=0)return `<div class="note">La medida es muy pequeña para el tablero.</div>`;
  let h=`<div class="small">Tablero: ${tb.n} × ${cm(tb.bw)} × ${cm(tb.bh)} cm · ${TAB_NOM[tb.mat]}</div>`;
  if(tb.mat!=="marmo"){const H=piezasTab(tb,"H"),V=piezasTab(tb,"V"),u=tb.util/10;
    h+=`<div class="small muted">Horizontal: ${H.cant*tb.n} piezas de ${cm(H.largo)} cm · Vertical: ${V.cant*tb.n} piezas de ${cm(V.largo)} cm (ancho útil ${String(u).replace(".",",")} cm)</div>`;
    if(tb.mat==="cielo"){const t=k=>{const p=piezasTab(tb,k);return tirasNecesarias(Array(p.cant*tb.n).fill(p.largo),pc.cielo.largo*10)};const a=t("H"),b=t("V");
      h+=`<div class="small muted">Tiras de ${pc.cielo.largo} cm: horizontal ${a} · vertical ${b}${a!==b?` → ${a<b?"horizontal":"vertical"} sale más barato`:""}</div>`}}
  else{const L=c.tableros[0];if(L)h+=`<div class="small muted">Esta puerta sola: ${esc(L.cobrado)}. En la cotización se suman los tableros de todas las puertas.</div>`}
  const falt=[...new Set([...dp.perfiles.filter(p=>p.ref&&!(+pc.perfiles[p.ref]>0)).map(p=>p.ref),...dp.acc.filter(a=>a[2]&&!(precioAccPta(a[2])>0)).map(a=>a[0]),
    ...(tb.mat==="marmo"&&!(+pc.marmo.precio>0)?["Lámina marmolizado"]:[]),...(tb.mat==="cielo"&&!(+pc.cielo.precio>0)?["Tira cielorraso"]:[])])];
  if(falt.length)h+=`<div class="note">Sin precio en Ajustes → Puertas: ${esc(falt.join(", "))}.</div>`;

/* Recorta lo blanco alrededor, vuelve transparente el fondo claro y la deja en tinta oscura */
function procesarFirma(src){const W=src.width,H=src.height,cx=src.getContext("2d"),d=cx.getImageData(0,0,W,H),p=d.data;let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=(y*W+x)*4,lum=(p[k]*0.3+p[k+1]*0.59+p[k+2]*0.11),a=p[k+3];
    if(a<10||lum>165){p[k+3]=0}else{p[k]=16;p[k+1]=35;p[k+2]=58;p[k+3]=Math.min(255,a*(1-lum/255)*2.2+60);if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return null;cx.putImageData(d,0,0);const m=6;x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(W-1,x1+m);y1=Math.min(H-1,y1+m);
  const w=x1-x0+1,h=y1-y0+1,sc=Math.min(1,600/w),out=document.createElement("canvas");out.width=Math.round(w*sc);out.height=Math.max(1,Math.round(h*sc));
  out.getContext("2d").drawImage(src,x0,y0,w,h,0,0,out.width,out.height);return {url:out.toDataURL("image/png"),ratio:out.width/out.height}}

  <span class="small muted">Firma con el dedo dentro del recuadro. Gira el teléfono si necesitas más espacio.</span>
  <canvas id="firma-pad" style="width:100%;height:200px;background:#fff;border:1.5px dashed var(--line);border-radius:8px;touch-action:none"></canvas>
  <div class="row"><button class="btn grow" data-act="firma-limpiar">Borrar</button><button class="btn pri grow" data-act="firma-ok">Guardar firma</button></div>`);
  const cv=$("#firma-pad"),r=cv.getBoundingClientRect(),dpr=Math.max(2,window.devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.6;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#10233a";S.firmaTrazo=false;let dn=false,lx=0,ly=0;

  cv.addEventListener("pointerdown",e=>{dn=true;try{cv.setPointerCapture(e.pointerId)}catch(er){}[lx,ly]=pos(e);g.beginPath();g.arc(lx,ly,1.2,0,7);g.fillStyle="#10233a";g.fill();S.firmaTrazo=true});

  if(t.dataset.draft&&S.draft){S.draft[t.dataset.draft]=t.value;if(t.tagName==="SELECT"&&t.dataset.draft==="clienteId"){const c=cliente(t.value);if(c&&!S.draft.direccion){S.draft.direccion=c.direccion||"";render()}}return}
  if(t.dataset.it&&S.itemTmp){const k=t.dataset.it;let v=t.type==="checkbox"?t.checked:t.value;
    if(k==="ancho"||k==="alto"||k==="ancho2"||k==="ancho3")v=Math.round(num(v)*10);else if(k==="cant"||k==="precioManual"||k==="instalacion"||k==="acero"||k==="vidrioTpl")v=Math.round(num(v));
    S.itemTmp[k]=v;const it=S.itemTmp;
    const calc=$("#it-calc");if(calc)calc.innerHTML=calcHtml(it);
    const sk=$(".sheet .sketch");if(sk)sk.innerHTML=sketch(it);return}
  if(t.dataset.cfg&&S.cfgEdit){const path=t.dataset.cfg.split(".");let o=S.cfgEdit;for(let i=0;i<path.length-1;i++)o=o[path[i]];const k=path[path.length-1];
    o[k]=(typeof o[k]==="number")?num(t.value):t.value;autoGuardarCfg();return}
  if(t.id==="cb-valor"){const h=$("#cb-letras");if(h){const v=Math.round(num(t.value));h.textContent=v?letras(v)+" PESOS M/CTE":""}return}
  if(t.dataset.buscar!==undefined){S.buscar=t.value;const pos=t.selectionStart;render();const nb=$("#buscar");nb.focus();try{nb.setSelectionRange(pos,pos)}catch(e){}}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="firma-file"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1400/im.width),cv=document.createElement("canvas");
      cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);if(guardarFirma(procesarFirma(cv)))render()};im.src=fr.result};fr.readAsDataURL(t.files[0]);t.value=""}
  if(t.id==="imp-file"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="alumel")throw 0;
    confirmar("Se agregarán o reemplazarán "+(d.clientes||[]).length+" clientes, "+(d.obras||[]).length+" obras y "+(d.cobros||[]).length+" cuentas de cobro del respaldo.","Importar",async()=>{
      if(d.cfg)await guardarCfg(migrarCfg(mergeCfg(DEFAULT_CFG,d.cfg)));for(const col of COLS)for(const x of (d[col]||[]))await guardar(col,x.id||uid(),x);toast("Respaldo importado")})}catch(e){toast("Ese archivo no es un respaldo de Alumel")}};r.readAsText(t.files[0]);t.value=""}
  if(t.dataset.actChange==="cortes-obra"){S.cortesObra=t.value;render()}
  if(t.id==="cb-obra"&&t.value){const o=obra(t.value);if(o&&!$("#cb-cli").value)$("#cb-cli").value=o.clienteId||""}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&sheetFn)closeSheet()});

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
iniciar();
</script>
