<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de taller — encabezado fijo, contenido de una columna (máx 920px), barra inferior de pestañas. Aluminio anodizado + verde de canto de vidrio. */
:root{
  --bg:#eef1f4;          /* aluminio claro */
  --surface:#ffffff;
  --surface-2:#e3e8ed;
  --line:#cbd3db;
  --fg:#18212b;
  --muted:#5b6876;
  --accent:#1d7f74;      /* canto de vidrio templado */
  --accent-ink:#ffffff;
  --accent-soft:#d5ece8;
  --metal:#2a3642;       /* perfil anodizado oscuro */
  --metal-ink:#e8edf2;
  --ok:#237a3b; --ok-soft:#dcefe0;
  --warn:#9a6200; --warn-soft:#f6ead2;
  --bad:#b23a2e; --bad-soft:#f7dedb;
  --info:#2f5f9e; --info-soft:#dde7f5;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181e;--surface:#1a222a;--surface-2:#232d37;--line:#33404c;--fg:#e6ebf0;--muted:#97a4b1;
  --accent:#4cb8aa;--accent-ink:#0c1a18;--accent-soft:#163631;--metal:#0c1116;--metal-ink:#dfe6ec;
  --ok:#6cc483;--ok-soft:#18321f;--warn:#e0aa4a;--warn-soft:#352812;--bad:#ec7b6f;--bad-soft:#3a1c19;--info:#7fa9e6;--info-soft:#1a2a40;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181e;--surface:#1a222a;--surface-2:#232d37;--line:#33404c;--fg:#e6ebf0;--muted:#97a4b1;
  --accent:#4cb8aa;--accent-ink:#0c1a18;--accent-soft:#163631;--metal:#0c1116;--metal-ink:#dfe6ec;
  --ok:#6cc483;--ok-soft:#18321f;--warn:#e0aa4a;--warn-soft:#352812;--bad:#ec7b6f;--bad-soft:#3a1c19;--info:#7fa9e6;--info-soft:#1a2a40;color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--metal)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--metal);color:var(--metal-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand b{font:700 24px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.brand span{font:500 12px/1 var(--f-mono);color:#93a3b2;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-bar{height:5px;max-width:920px;margin:8px auto 0;border-radius:2px;
  background:linear-gradient(180deg,#9fb0bf 0,#e7edf2 45%,#7d8d9c 100%)}
.icon-btn{background:transparent;border:1px solid #445261;color:var(--metal-ink);border-radius:8px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.icon-btn:hover{border-color:#7d8d9c}
.sync{font:500 11px/1 var(--f-mono);color:#93a3b2;white-space:nowrap}
.sync.err{color:#f0a097}

/* Main */
main{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05;text-transform:uppercase}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:17px;font-weight:600}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.stat .v{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:6px;word-break:break-word}
@media (max-width:420px){.stat .v{font-size:19px}}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.dark{background:var(--metal);color:var(--metal-ink);border-color:var(--metal)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkish{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}

/* Chips & pills */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--metal);color:var(--metal-ink);border-color:var(--metal)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-cot{background:var(--info-soft);color:var(--info)}
.st-apr{background:var(--accent-soft);color:var(--accent)}
.st-pro{background:var(--warn-soft);color:var(--warn)}
.st-ins{background:var(--warn-soft);color:var(--warn)}
.st-ent{background:var(--ok-soft);color:var(--ok)}
.st-pag{background:var(--ok-soft);color:var(--ok)}
.st-par{background:var(--warn-soft);color:var(--warn)}
.st-pen{background:var(--bad-soft);color:var(--bad)}
.st-anu{background:var(--surface-2);color:var(--muted)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600}
.li .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty b{color:var(--fg);font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.04em}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 10px;background:var(--surface-2);white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface-2)}

/* Forms */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr 1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font:500 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px;min-height:44px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer;flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.note{border-left:3px solid var(--warn);background:var(--warn-soft);color:var(--fg);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}
.note.info{border-color:var(--info);background:var(--info-soft)}
.total-bar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--metal);color:var(--metal-ink);border-radius:var(--r);padding:14px 16px}
.total-bar .v{font:700 28px/1 var(--f-display);font-variant-numeric:tabular-nums}

/* Window sketch */
.sketch{display:flex;justify-content:center;background:var(--surface-2);border-radius:8px;padding:10px}
.sketch svg{max-width:100%;height:auto}

/* Bars (despiece) */
.bar{display:flex;height:26px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.bar .cut{background:var(--metal);color:var(--metal-ink);font:500 10px/26px var(--f-mono);text-align:center;overflow:hidden;white-space:nowrap;border-right:2px solid var(--bg);min-width:0}
.bar .cut:nth-child(even){background:color-mix(in srgb,var(--metal) 78%,var(--accent))}
.barline{display:grid;grid-template-columns:56px minmax(0,1fr) 66px;gap:8px;align-items:center;font-size:12px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.2}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--bg);padding-block:4px;z-index:2}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--metal);color:var(--metal-ink);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.cols2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px}
.cin{border:1px solid var(--line);border-radius:6px;padding:7px;background:var(--surface);font-size:16px;min-height:38px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
</style>

function letras(n){

  const C=["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  const tres=x=>{if(x===0)return"";if(x===100)return"CIEN";const c=Math.floor(x/100),r=x%100;let s=C[c];
    if(r){s+=(s?" ":"")+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?" Y "+U[r%10]:""))}return s};
  const apoc=s=>s.replace(/VEINTIUNO$/,"VEINTIÚN").replace(/UNO$/,"UN");
  const mm=Math.floor(n/1e6),resto=n%1e6,mil=Math.floor(resto/1000),u=resto%1000;let out=[];
  if(mm){if(mm===1)out.push("UN MILLÓN");else{const mmM=Math.floor(mm/1000),mmU=mm%1000;let s="";if(mmM)s=(mmM===1?"":apoc(tres(mmM))+" ")+"MIL";if(mmU)s+=(s?" ":"")+apoc(tres(mmU));out.push(s+" MILLONES")}}
  if(mil)out.push(mil===1?"MIL":apoc(tres(mil))+" MIL");
  if(u)out.push(tres(u));
  let s=apoc(out.join(" "));if(mm&&!resto)s+=" DE";return s;
}

/* Acomoda rectángulos en láminas (corte guillotina, permite girar). Devuelve las láminas usadas. */
function packRects(rects,W,H){

  const place=(s,r)=>{for(let k=0;k<s.free.length;k++){const f=s.free[k];

/* Empaque de cortes en barras (primero el más largo) */
function barras(cortes){
  const L=S.cfg.barra||6000,k=S.cfg.sierra||4,list=[],bars=[];
  cortes.forEach(c=>{for(let i=0;i<c.cant;i++)list.push(c.largo)});
  list.sort((a,b)=>b-a);
  for(const l of list){if(l>L){bars.push({cuts:[l],used:l,over:true});continue}
    let b=bars.find(b=>!b.over&&b.used+l+(b.cuts.length?k:0)<=L);
    if(!b){b={cuts:[],used:0};bars.push(b)}b.used+=l+(b.cuts.length?k:0);b.cuts.push(l)}
  return bars;
}
function sumarDespiece(items){
  const per={},vid={},acc={};
  for(const it of items){const dp=despiece(it),color=it.color||"",vn=vidrioDe(it.vidrio).nombre;
    for(const p of dp.perfiles){const sis=p.sis||TIPOS[it.tipo].corto,key=sis+"|"+p.nombre+"|"+(p.pool==="cielo"?"":color);(per[key]=per[key]||{sistema:sis,nombre:p.nombre,color,cortes:{}});per[key].cortes[p.largo]=(per[key].cortes[p.largo]||0)+p.cant}
    for(const v of dp.vidrios){const key=vn+"|"+v.ancho+"|"+v.alto+"|"+v.nota;(vid[key]=vid[key]||{vidrio:vn,ancho:v.ancho,alto:v.alto,nota:v.nota,cant:0});vid[key].cant+=v.cant}
    for(const [n,c] of dp.acc){acc[n]=(acc[n]||0)+c}}

      inner+=`<rect x="${cx+4}" y="${y+4}" width="${hw-8}" height="${h-8}" ${t==="C"?glass:'fill="var(--surface)"'} ${s} stroke-width="2"/><text x="${cx+hw/2}" y="${y+h/2+5}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="500" fill="currentColor">${t}</text>`})}
  else if(it.tipo==="corrediza"||it.tipo==="division"){const hw=w/n;for(let i=0;i<n;i++){inner+=`<rect x="${x+4+i*hw}" y="${y+4}" width="${hw-8}" height="${h-8}" ${glass} ${s} stroke-width="2"/>`}
    inner+=`<path d="M${x+w/2-14} ${y+h/2}h28m-6-5 6 5-6 5" fill="none" ${s} stroke-width="1.5"/>`}
  else if(it.tipo==="proyectante"){inner=`<rect x="${x+5}" y="${y+5}" width="${w-10}" height="${h-10}" ${glass} ${s} stroke-width="2"/><path d="M${x+5} ${y+h-5}L${x+w/2} ${y+5}L${x+w-5} ${y+h-5}" fill="none" ${s} stroke-dasharray="4 3"/>`}
  else if(TIPOS[it.tipo]?.puerta){const tb=tableroPta(it),pz=piezasTab(tb,it.orient),nl=tb.mat==="marmo"?0:Math.min(40,pz.cant),fl='fill="var(--surface)"';
    const lines=(bx,by,bw,bh)=>{let l="";for(let k=1;k<nl;k++)l+=it.orient==="V"?`<line x1="${bx+bw*k/nl}" y1="${by}" x2="${bx+bw*k/nl}" y2="${by+bh}" ${s} stroke-width=".7"/>`:`<line x1="${bx}" y1="${by+bh*k/nl}" x2="${bx+bw}" y2="${by+bh*k/nl}" ${s} stroke-width=".7"/>`;return l};
    const board=(bx,by,bw,bh)=>`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" ${tb.mat==="marmo"?'fill="var(--surface-2)"':fl} ${s} stroke-width="1.2"/>${lines(bx,by,bw,bh)}`;
    inner=`<rect x="${x+4}" y="${y+4}" width="${w-8}" height="${h-8}" fill="none" ${s} stroke-width="2"/>`;
    if(it.tipo==="p1"){const bx=x+9,bw=w-18,bh=(h-18-8)/2;inner+=board(bx,y+9,bw,bh)+`<rect x="${bx}" y="${y+9+bh}" width="${bw}" height="8" fill="currentColor" opacity=".55"/>`+board(bx,y+17+bh,bw,bh)}
    else{const m=it.nave==="t244"?14:9;inner+=board(x+m,y+m,w-2*m,h-2*m)}
    inner+=`<circle cx="${x+w-(it.nave==="t244"&&it.tipo==="p15"?8:6)}" cy="${y+h/2+4}" r="2.6" fill="currentColor"/>`}
  else if(it.tipo==="puerta"){inner=`<rect x="${x+5}" y="${y+5}" width="${w-10}" height="${h/2-8}" ${glass} ${s} stroke-width="2"/><rect x="${x+5}" y="${y+h/2+3}" width="${w-10}" height="${h/2-8}" ${glass} ${s} stroke-width="2"/><circle cx="${x+w-14}" cy="${y+h/2}" r="3" fill="currentColor"/>`}
  else if(it.tipo==="pasamanos"){inner=`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${glass} ${s} stroke-width="2"/>`+[[8,8],[w-8,8],[8,h-8],[w-8,h-8]].map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="3" fill="none" ${s}/>`).join("")}
  else{inner=`<rect x="${x+5}" y="${y+5}" width="${w-10}" height="${h-10}" ${glass} ${s} stroke-width="2"/>`}
  const frame=it.tipo==="pasamanos"?"":`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" ${s} stroke-width="3"/>`;
  const nq=it.cant||1;
  return `<svg viewBox="0 0 260 ${h+(nq>1?62:44)}" width="260" style="color:var(--fg)">${frame}${inner}${nq>1?`<text x="130" y="${y+h+40}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="13" font-weight="600" fill="currentColor">Cantidad: ${nq}</text>`:""}

const COLS=["clientes","obras","cobros"];
async function guardar(col,id,data){
  if(S.readonly){toast("No tienes permiso para guardar.");throw new Error("readonly")}
  data={...data,id,actualizado:new Date().toISOString(),por:S.user?.email||""};
  const arr=S[col],i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=data;else arr.push(data);
  if(S.db)S.db.collection(col).doc(id).set(stripId(data)).catch(errGuardar);else saveLocal();
  return data;
}
async function borrar(col,id){S[col]=S[col].filter(x=>x.id!==id);if(S.db)S.db.collection(col).doc(id).delete().catch(errGuardar);else saveLocal()}
async function guardarCfg(cfg){S.cfg=cfg;S.cfgExists=true;if(S.db)S.db.doc("config/general").set(clone(cfg)).catch(errGuardar);else saveLocal()}
function stripId(d){const o={...d};delete o.id;return JSON.parse(JSON.stringify(o))}
function errGuardar(e){
  if(e&&e.code==="permission-denied"){S.readonly=true;toast("Tu usuario no tiene permiso para guardar. Pide que te agreguen en las reglas de Firebase.")}
  else if(e&&e.code==="resource-exhausted")toast("Se llenó la cuota gratuita de hoy. Intenta mañana.");
  else toast("No se pudo guardar en la nube: "+(e?.message||"error"));
  setSync();
}
function saveLocal(){try{localStorage.setItem("alumel-local",JSON.stringify({cfg:S.cfg,clientes:S.clientes,obras:S.obras,cobros:S.cobros}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem("alumel-local")||"null");if(d){S.cfg=migrarCfg(mergeCfg(DEFAULT_CFG,d.cfg||{}));S.clientes=d.clientes||[];S.obras=d.obras||[];S.cobros=d.cobros||[]}}catch(e){}}
function setSync(){const el=$("#sync");if(!el)return;
  if(S.offline){el.textContent="Solo este equipo";el.className="sync err";return}
  if(S.readonly){el.textContent="Sin permiso";el.className="sync err";return}
  if(!navigator.onLine){el.textContent="Sin señal · guardando aquí";el.className="sync err";return}
  if(S.pendientes){el.textContent="Sincronizando…";el.className="sync";return}
  const all=["config",...COLS].every(k=>S.loaded[k]);el.textContent=all?"● Sincronizado":"Cargando…";el.className="sync"}
window.addEventListener("online",setSync);window.addEventListener("offline",setSync);

function firebaseListo(){const c=window.ALUMEL_FIREBASE;return !!(window.firebase&&c&&c.apiKey&&!/PEGAR/.test(c.apiKey))}
async function iniciar(){
  if(!firebaseListo()){S.offline=true;loadLocal();S.view=S.view||"obras";setSync();render();return}
  firebase.initializeApp(window.ALUMEL_FIREBASE);
  const db=firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}
  S.auth=firebase.auth();
  S.view="cargando";render();
  S.auth.onAuthStateChanged(u=>{
    if(!u){S.user=null;S.db=null;(S.unsubs||[]).forEach(f=>f());S.unsubs=[];S.view="login";render();return}
    S.user=u;S.db=db;S.readonly=false;if(S.view==="login"||S.view==="cargando")S.view="obras";render();conectar(db)});
}
function conectar(db){
  S.unsubs=[];S.loaded={};
  const timer=setTimeout(()=>{if(!["config",...COLS].every(k=>S.loaded[k]))setSync()},10000);
  const done=k=>{S.loaded[k]=true;if(["config",...COLS].every(x=>S.loaded[x]))clearTimeout(timer);setSync()};
  const err=k=>e=>{done(k);if(e.code==="permission-denied"){S.readonly=true;setSync();toast("Tu usuario no tiene permiso. Pide que te agreguen.")}};
  S.unsubs.push(db.doc("config/general").onSnapshot({includeMetadataChanges:true},snap=>{S.cfgExists=snap.exists;S.cfg=migrarCfg(snap.exists?mergeCfg(DEFAULT_CFG,snap.data()):clone(DEFAULT_CFG));done("config");softRender()},err("config")));
  for(const col of COLS){
    S.unsubs.push(db.collection(col).onSnapshot({includeMetadataChanges:true},snap=>{S[col]=snap.docs.map(d=>({...d.data(),id:d.id}));S.pendientes=snap.metadata.hasPendingWrites;done(col);softRender()},err(col)));
  }
}

function calcHtml(it){

  ${pta?ptaInfo(it,c):""}

/* ============ Sheet ============ */
let sheetFn=null;
function openSheet(fn){sheetFn=fn;$("#sheet-root").innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${fn()}</div></div>`;document.body.style.overflow="hidden"}
function refreshSheet(){const sh=$(".sheet");if(!sh||!sheetFn)return;const st=sh.scrollTop,a=document.activeElement?.id;sh.innerHTML=sheetFn();sh.scrollTop=st;if(a){const el=document.getElementById(a);if(el){el.focus();if(el.setSelectionRange&&el.type!=="number")try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}}
function closeSheet(){sheetFn=null;$("#sheet-root").innerHTML="";document.body.style.overflow="";render()}
function confirmar(msg,okTxt,fn){S.confirmFn=fn;openSheet(()=>`<div class="sheet-h"><h2>¿Seguro?</h2></div><p style="margin:0">${esc(msg)}</p><div class="row"><button class="btn danger grow" data-act="confirm-ok">${esc(okTxt)}</button><button class="btn grow" data-act="cerrar">Cancelar</button></div>`)}

/* ============ Texto y PDF ============ */
async function copiar(txt){try{await navigator.clipboard.writeText(txt);toast("Copiado")}catch(e){openSheet(()=>`<div class="sheet-h"><h2>Copia este texto</h2><button class="btn sm" data-act="cerrar">Cerrar</button></div><textarea id="copy-area" style="width:100%;min-height:260px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);font-size:14px">${esc(txt)}</textarea>`);setTimeout(()=>{const t=$("#copy-area");t&&t.select()},50)}}
function textoCot(o){const c=cliente(o.clienteId),e=S.cfg.empresa;
  return `*${e.nombre}*\nCotización COT-${pad(o.numero||0)} · ${fechaCorta(o.fecha)}\n${c?"Cliente: "+c.nombre+"\n":""}Obra: ${o.nombre||""}\n\n`+
  (o.items||[]).map((it,i)=>`${i+1}. ${describeItem(it)} ${cm(it.ancho)} × ${cm(it.alto)} cm · ${detalleItem(it)} × ${it.cant} = ${money(calcDe(o).lineas[i]?.total)}`).join("\n")+
  (()=>{const R=calcDe(o).resumen;return `\n\nMateriales: ${money(R.perfiles)}\nVidrio: ${money(R.vidrio)}`+(R.tableros?`\nTableros PVC: ${money(R.tableros)}`:"")+`\nAccesorios: ${money(R.accesorios)}\nInstalación: ${money(R.instalacion)}`+(R.manual?`\nPrecio manual: ${money(R.manual)}`:"")+(Math.abs(R.ajuste)>=1?`\n${S.cfg.margen?"Margen y redondeo":"Redondeo"}: ${money(R.ajuste)}`:"")})()+
  `\n\n*TOTAL: ${money(totalObra(o))}*`+(o.notas?"\n\n"+o.notas:"")+(e.telefono?"\n\nTel: "+e.telefono:"")}
function textoCobro(c){const cl=cliente(c.clienteId),e=S.cfg.empresa;
  return `CUENTA DE COBRO No. ${pad(c.numero)}\n${e.ciudad?e.ciudad+", ":""}${fechaLarga(c.fecha)}\n\n${cl?cl.nombre+(cl.nit?"\nNIT/C.C. "+cl.nit:""):""}\n\nDEBE A:\n${e.propietario||e.nombre}${e.cc?"\nC.C. "+e.cc:""}\n\nLA SUMA DE: ${letras(+c.valor||0)} PESOS M/CTE (${money(c.valor)})\n\nPOR CONCEPTO DE: ${c.concepto}\n\n${e.nota||""}${e.banco?"\nPago a: "+e.banco:""}`}
async function entregarArchivo(nombre,blob){
  const f=new File([blob],nombre,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:nombre});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);toast("Archivo descargado");
}
async function guardarArchivo(nombre,doc){entregarArchivo(nombre,new Blob([doc.output("arraybuffer")],{type:"application/pdf"}))}
async function compartirTexto(txt){if(navigator.share){try{await navigator.share({text:txt});return}catch(e){if(e.name==="AbortError")return}}copiar(txt)}
function pdfBase(){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"letter"});return doc}
function pdfHeader(doc,titulo,sub){const e=S.cfg.empresa;
  doc.setFillColor(42,54,66);doc.rect(0,0,216,28,"F");doc.setFillColor(29,127,116);doc.rect(0,28,216,1.6,"F");
  doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(18);doc.text(e.nombre.toUpperCase(),16,13);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text([e.propietario?(e.propietario+(e.cc?" · C.C. "+e.cc:"")):"",[e.ciudad,e.telefono].filter(Boolean).join(" · ")].filter(Boolean),16,19);
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(titulo,200,13,{align:"right"});doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(sub,200,19,{align:"right"});
  doc.setTextColor(24,33,43);}
function pdfCot(o){if(!window.jspdf){toast("No cargó el generador de PDF. Revisa la conexión.");return}
  const doc=pdfBase(),c=cliente(o.clienteId),calc=calcDe(o),R=calc.resumen;pdfHeader(doc,"COTIZACIÓN","COT-"+pad(o.numero||0)+" · "+fechaCorta(o.fecha));
  let y=40;doc.setFontSize(10);doc.setFont("helvetica","bold");doc.text("Cliente:",16,y);doc.setFont("helvetica","normal");doc.text((c?.nombre||"")+(c?.nit?"  ·  "+c.nit:""),36,y);y+=6;
  doc.setFont("helvetica","bold");doc.text("Obra:",16,y);doc.setFont("helvetica","normal");doc.text(doc.splitTextToSize((o.nombre||"")+(o.direccion?" · "+o.direccion:""),160),36,y);y+=10;
  const cols=[16,26,110,140,155,178];doc.setFillColor(227,232,237);doc.rect(14,y-5,188,8,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);
  ["#","Descripción","Medida (cm)","Cant","Valor unit.","Total"].forEach((h,i)=>doc.text(h,i>=3?(i===3?150:i===4?173:200):cols[i],y,{align:i>=3?"right":"left"}));y+=8;doc.setFont("helvetica","normal");
  (o.items||[]).forEach((it,i)=>{const desc=doc.splitTextToSize(describeItem(it)+" · "+detalleItem(it)+(it.ubicacion?" · "+it.ubicacion:""),80);
    if(y+desc.length*4>250){doc.addPage();y=20}
    doc.text(String(i+1),16,y);doc.text(desc,26,y);doc.text(cm(it.ancho)+" × "+cm(it.alto),110,y);doc.text(String(it.cant),150,y,{align:"right"});doc.text(money(calc.lineas[i]?.unit),173,y,{align:"right"});doc.text(money(calc.lineas[i]?.total),200,y,{align:"right"});
    y+=desc.length*4+3;doc.setDrawColor(203,211,219);doc.line(14,y-2,202,y-2);});
  y+=3;if(y>215){doc.addPage();y=20}doc.setFontSize(10);
  [["Materiales (perfilería)",R.perfiles],["Vidrio",R.vidrio],["Tableros PVC",R.tableros||0],["Accesorios",R.accesorios],["Instalación",R.instalacion],["Precio manual",R.manual],[S.cfg.margen?"Margen y redondeo":"Redondeo",Math.abs(R.ajuste)>=1?R.ajuste:0]].filter(r=>r[1]).forEach(([t,v])=>{doc.text(t,124,y);doc.text(money(v),200,y,{align:"right"});y+=5.5});
  y+=4;doc.setFillColor(42,54,66);doc.rect(120,y-5,82,10,"F");doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text("TOTAL",124,y+1.5);doc.text(money(totalObra(o)),200,y+1.5,{align:"right"});doc.setTextColor(24,33,43);
  y+=14;if(o.notas){doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text("Notas",16,y);doc.setFont("helvetica","normal");doc.text(doc.splitTextToSize(o.notas,180),16,y+5)}
  guardarArchivo("Cotizacion_COT-"+pad(o.numero||0)+".pdf",doc)}
function pdfCobro(c){if(!window.jspdf){toast("No cargó el generador de PDF. Revisa la conexión.");return}

document.addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="scrim"){if(ev.target===b)closeSheet();return}
  switch(a){
    case"go":S.cfgEdit=null;go(b.dataset.v);break;
    case"filtro-obras":S.filtroObras=b.dataset.v;render();break;
    case"filtro-cobros":S.filtroCobros=b.dataset.v;render();break;
    case"ver-obra":go("obra",id);break;
    case"ver-cobro":go("cobro",id);break;
    case"ver-cliente":go("cliente",id);break;
    case"nueva-cot":S.draft=nuevoDraft();go("cotizar");break;
    case"nueva-cot-cliente":S.draft={...nuevoDraft(),clienteId:id,direccion:cliente(id)?.direccion||""};go("cotizar");break;
    case"editar-obra":S.draft=clone(obra(id));go("cotizar");break;
    case"descartar":S.draft=nuevoDraft();render();break;
    case"cortes-obra":S.cortesObra=id;go("cortes");break;
    case"estado-obra":{const o=obra(id);if(o&&o.estado!==b.dataset.v){try{await guardar("obras",id,{...o,estado:b.dataset.v});toast("Estado: "+estadoDe(b.dataset.v)[1])}catch(e){}render()}break}
    case"borrar-obra":confirmar("Se borra la obra y su cotización. Las cuentas de cobro quedan.","Eliminar obra",async()=>{await borrar("obras",id);go("obras")});break;
    case"nuevo-item":itemSheet(null);break;
    case"editar-item":itemSheet(+b.dataset.i);break;
    case"it-tipo":{const t=b.dataset.v;S.itemTmp.tipo=t;S.itemTmp.instalacion=instDe(t);if(TIPOS[t].serie&&!S.itemTmp.naves){S.itemTmp.naves=2;S.itemTmp.dist="FI";S.itemTmp.rod="nylon"}if(t==="pasamanos"){S.itemTmp.alto=850;const tv=S.cfg.vidrios.find(v=>/templ/i.test(v.nombre));if(tv)S.itemTmp.vidrio=tv.id}
      if(t==="division"){S.itemTmp.hojas=2;S.itemTmp.alto=S.itemTmp.alto<1700?1900:S.itemTmp.alto;const tv=S.cfg.vidrios.find(v=>/templ/i.test(v.nombre));if(tv)S.itemTmp.vidrio=tv.id}
      if(TIPOS[t].puerta){const d=S.itemTmp;d.tab1=d.tab1||"f06";d.nave=d.nave||"t87";d.tab15=d.tab15||"t166";d.orient=d.orient||"H";if(d.mediaLam==null)d.mediaLam=true;
        if(d.alto<1800)d.alto=2100;if(d.ancho>1300)d.ancho=900}
      if(t==="puerta"&&S.itemTmp.alto<1800)S.itemTmp.alto=2100;refreshSheet();break}
    case"marmo-media":S.draft.marmoMedia=b.dataset.v==="1";render();break;
    case"it-set":S.itemTmp[b.dataset.k]=b.dataset.v;refreshSheet();break;
    case"it-hojas":S.itemTmp.hojas=+b.dataset.v;refreshSheet();break;
    case"it-naves":{const n=+b.dataset.v;S.itemTmp.naves=n;S.itemTmp.dist=n===2?"FI":n===3?"FI":"FCCF";refreshSheet();break}
    case"it-dist":S.itemTmp.dist=b.dataset.v;refreshSheet();break;
    case"it-rod":S.itemTmp.rod=b.dataset.v;refreshSheet();break;
    case"guardar-item":{const it=S.itemTmp;if(!(it.ancho>0&&it.alto>0)){toast("Escribe ancho y alto");return}
      it.cant=Math.max(1,Math.round(it.cant||1));delete it.precioCalc;
      if(S.itemIdx!=null)S.draft.items[S.itemIdx]=it;else S.draft.items.push(it);closeSheet();break}
    case"quitar-item":S.draft.items.splice(S.itemIdx,1);closeSheet();break;
    case"guardar-obra":{const d=S.draft;if(!d.items.length){toast("Agrega al menos un ítem");return}
      if(!d.nombre){toast("Ponle nombre a la obra");$("#d-nombre")?.focus();return}
      const id2=d.id||uid();const prev=d.id?obra(d.id):null;
      const numero=prev?.numero||Math.max(0,...S.obras.map(o=>o.numero||0))+1;
      const calc=calcCot(d.items,d);try{await guardar("obras",id2,{...d,id:undefined,numero,calc,total:calc.resumen.total});toast("Cotización guardada");S.draft=nuevoDraft();go("obra",id2)}catch(e){}break}
    case"nuevo-cliente":clienteSheet(null,b.dataset.from);break;
    case"editar-cliente":clienteSheet(id);break;
    case"guardar-cliente":{const nombre=$("#cl-nombre").value.trim();if(!nombre){toast("Escribe el nombre");return}
      const id2=S.clienteId||uid();const data={nombre,telefono:$("#cl-tel").value.trim(),nit:$("#cl-nit").value.trim(),direccion:$("#cl-dir").value.trim(),notas:$("#cl-notas").value.trim()};
      try{await guardar("clientes",id2,data);toast("Cliente guardado");if(S.clienteFrom==="cotizar"&&S.draft){S.draft.clienteId=id2;if(!S.draft.direccion)S.draft.direccion=data.direccion}closeSheet()}catch(e){}break}
    case"borrar-cliente":confirmar("Se borra el cliente. Sus obras y cuentas quedan sin cliente asignado.","Eliminar cliente",async()=>{await borrar("clientes",id);go("clientes")});break;
    case"nuevo-cobro":cobroSheet(null,b.dataset.obra);break;
    case"editar-cobro":cobroSheet(id);break;
    case"guardar-cobro":{const t=S.cobroTmp;const valor=Math.round(num($("#cb-valor").value));const numero=Math.round(num($("#cb-num").value));
      if(!valor){toast("Escribe el valor");return}if(!$("#cb-cli").value){toast("Elige el cliente");return}
      if(S.cobros.some(x=>x.numero===numero&&x.id!==t.id)){toast("Ya existe la cuenta No. "+pad(numero));return}
      const id2=t.id||uid();const data={numero,fecha:$("#cb-fecha").value||hoy(),clienteId:$("#cb-cli").value,obraId:$("#cb-obra").value,concepto:$("#cb-conc").value.trim(),valor,abonos:t.abonos||[],anulada:!!t.anulada};
      try{await guardar("cobros",id2,data);toast("Cuenta de cobro guardada");sheetFn=null;$("#sheet-root").innerHTML="";document.body.style.overflow="";go("cobro",id2)}catch(e){}break}
    case"anular-cobro":{const c=S.cobros.find(x=>x.id===id);if(c.anulada){await guardar("cobros",id,{...c,anulada:false}).catch(()=>{});render()}else confirmar("La cuenta queda marcada como anulada y no suma al saldo.","Anular cuenta",async()=>{await guardar("cobros",id,{...c,anulada:true})});break}
    case"nuevo-abono":{S.abonoId=id;const s=saldoCobro(S.cobros.find(x=>x.id===id));openSheet(()=>`<div class="sheet-h"><h2>Registrar abono</h2><button class="btn sm" data-act="cerrar">Cerrar</button></div>
      <div class="fgrid"><div class="field"><label for="ab-valor">Valor ($)</label><input id="ab-valor" inputmode="numeric" value="${s.saldo}"></div><div class="field"><label for="ab-fecha">Fecha</label><input id="ab-fecha" type="date" value="${hoy()}"></div>
      <div class="field full"><label for="ab-nota">Nota</label><input id="ab-nota" placeholder="Ej: Transferencia, efectivo"></div></div><button class="btn pri block" data-act="guardar-abono">Guardar abono</button>`);break}
    case"guardar-abono":{const c=S.cobros.find(x=>x.id===S.abonoId);const v=Math.round(num($("#ab-valor").value));if(!v){toast("Escribe el valor");return}
      try{await guardar("cobros",c.id,{...c,abonos:[...(c.abonos||[]),{valor:v,fecha:$("#ab-fecha").value||hoy(),nota:$("#ab-nota").value.trim()}]});toast("Abono registrado");closeSheet()}catch(e){}break}
    case"borrar-abono":{const c=S.cobros.find(x=>x.id===id);const i=+b.dataset.i;confirmar("Se borra el abono de "+money(c.abonos[i].valor)+".","Borrar abono",async()=>{const ab=[...c.abonos];ab.splice(i,1);await guardar("cobros",id,{...c,abonos:ab})});break}
    case"confirm-ok":{const fn=S.confirmFn;S.confirmFn=null;try{await fn()}catch(e){}closeSheet();break}
    case"cerrar":closeSheet();break;
    case"login":{const m=$("#lg-mail").value.trim(),p=$("#lg-pass").value,er=$("#lg-err");er.textContent="";if(!m||!p){er.textContent="Escribe correo y clave.";return}
      b.disabled=true;try{await S.auth.signInWithEmailAndPassword(m,p)}catch(e){b.disabled=false;er.textContent=({"auth/invalid-credential":"Correo o clave incorrectos.","auth/wrong-password":"Correo o clave incorrectos.","auth/user-not-found":"Ese correo no está registrado.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos.","auth/network-request-failed":"Sin internet. La primera vez necesitas conexión para entrar."})[e.code]||e.message}break}
    case"olvide":{const m=$("#lg-mail").value.trim();if(!m){$("#lg-err").textContent="Escribe tu correo y vuelve a tocar 'Olvidé mi clave'.";return}try{await S.auth.sendPasswordResetEmail(m);toast("Te enviamos un correo para cambiar la clave")}catch(e){$("#lg-err").textContent="No se pudo enviar: "+e.message}break}
    case"logout":confirmar("Vas a cerrar sesión en este equipo.","Cerrar sesión",async()=>{await S.auth.signOut()});break;
    case"exportar":{const data={app:"alumel",version:1,fecha:new Date().toISOString(),cfg:S.cfg,clientes:S.clientes,obras:S.obras,cobros:S.cobros};
      entregarArchivo("alumel-respaldo-"+hoy()+".json",new Blob([JSON.stringify(data,null,1)],{type:"application/json"}));break}
    case"pdf-cot":pdfCot(obra(id));break;
    case"pdf-cobro":pdfCobro(S.cobros.find(x=>x.id===id));break;
    case"copiar-cot":compartirTexto(textoCot(obra(id)));break;
    case"copiar-cobro":compartirTexto(textoCobro(S.cobros.find(x=>x.id===id)));break;
    case"copiar":copiar(b.dataset.v);break;
    case"copiar-vidrios":{const sel=b.dataset.v;const items=sel==="__draft"?S.draft.items:(obra(sel)?.items||[]);const r=sumarDespiece(items);const o=obra(sel);
      copiar(`Pedido de vidrio — ${S.cfg.empresa.nombre}${o?"\nObra: "+o.nombre:""}\n\n`+r.vid.map(v=>`${v.cant} × ${cm(v.ancho)} × ${cm(v.alto)} cm · ${v.vidrio}${v.nota?" ("+v.nota+")":""}`).join("\n"));break}
    case"add-vidrio":S.cfgEdit.vidrios.push({id:uid(),nombre:"Nuevo vidrio",m2:0,lam:0,lamA:330,lamH:214});render();break;
    case"del-vidrio":if(S.cfgEdit.vidrios.length>1){S.cfgEdit.vidrios.splice(+b.dataset.i,1);render()}break;
    case"add-color":S.cfgEdit.colores.push({nombre:"Nuevo color",factor:1});render();break;
    case"del-color":if(S.cfgEdit.colores.length>1){S.cfgEdit.colores.splice(+b.dataset.i,1);render()}break;
    case"guardar-cfg":{const c=clone(S.cfgEdit);c.preciosEjemplo=false;try{await guardarCfg(c);S.cfgEdit=null;toast("Ajustes guardados");render()}catch(e){}break}
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.draftChk&&S.draft){S.draft[t.dataset.draftChk]=t.checked;render();return}
  if(t.dataset.draft&&S.draft){S.draft[t.dataset.draft]=t.value;if(t.tagName==="SELECT"&&t.dataset.draft==="clienteId"){const c=cliente(t.value);if(c&&!S.draft.direccion){S.draft.direccion=c.direccion||"";render()}}return}
  if(t.dataset.it&&S.itemTmp){const k=t.dataset.it;let v=t.type==="checkbox"?t.checked:t.value;
    if(k==="ancho"||k==="alto")v=Math.round(num(v)*10);else if(k==="cant"||k==="precioManual"||k==="instalacion")v=Math.round(num(v));
    S.itemTmp[k]=v;const it=S.itemTmp;
    const calc=$("#it-calc");if(calc)calc.innerHTML=calcHtml(it);
    const sk=$(".sheet .sketch");if(sk)sk.innerHTML=sketch(it);return}
  if(t.dataset.cfg&&S.cfgEdit){const path=t.dataset.cfg.split(".");let o=S.cfgEdit;for(let i=0;i<path.length-1;i++)o=o[path[i]];const k=path[path.length-1];
    o[k]=(typeof o[k]==="number")?num(t.value):t.value;return}
  if(t.id==="cb-valor"){const h=$("#cb-letras");if(h){const v=Math.round(num(t.value));h.textContent=v?letras(v)+" PESOS M/CTE":""}return}
  if(t.dataset.buscar!==undefined){S.buscar=t.value;const pos=t.selectionStart;render();const nb=$("#buscar");nb.focus();try{nb.setSelectionRange(pos,pos)}catch(e){}}
});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="imp-file"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="alumel")throw 0;
    confirmar("Se agregarán o reemplazarán "+(d.clientes||[]).length+" clientes, "+(d.obras||[]).length+" obras y "+(d.cobros||[]).length+" cuentas de cobro del respaldo.","Importar",async()=>{
      if(d.cfg)await guardarCfg(migrarCfg(mergeCfg(DEFAULT_CFG,d.cfg)));for(const col of COLS)for(const x of (d[col]||[]))await guardar(col,x.id||uid(),x);toast("Respaldo importado")})}catch(e){toast("Ese archivo no es un respaldo de Alumel")}};r.readAsText(t.files[0]);t.value=""}
  if(t.dataset.actChange==="cortes-obra"){S.cortesObra=t.value;render()}
  if(t.id==="cb-obra"&&t.value){const o=obra(t.value);if(o&&!$("#cb-cli").value)$("#cb-cli").value=o.clienteId||""}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&sheetFn)closeSheet()});

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
iniciar();
</script>
